name: Release binaries

# Publishes prebuilt Linux binaries to the "latest" GitHub release on every push
# to main. The Pterodactyl / Pelican egg downloads them on startup.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu so the binary runs on older glibc versions too.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - run: cargo build --release --locked
      - run: cp target/release/aoede aoede-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: aoede-linux-${{ matrix.arch }}
          path: aoede-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aoede-linux-*
          merge-multiple: true

      - name: Upload to the "latest" release
        run: |
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "Latest build" \
              --notes "Automatically built from the main branch. Used by the Pterodactyl / Pelican egg."
          fi
          gh release upload latest dist/aoede-linux-* --clobber
          # Upload the version last, so it only changes once the binaries are in place.
          echo "$GITHUB_SHA" > dist/version.txt
          gh release upload latest dist/version.txt --clobber
