[package]
name = "aoede"
version = "0.9.0"
authors = ["Max Isom <hi@maxisom.me>"]
edition = "2021"

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
songbird = "0.6.1"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "cache", "model", "rustls_backend", "voice"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
flume = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }

[profile.dev]
split-debuginfo = "unpacked"
