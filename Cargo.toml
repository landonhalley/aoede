[package]
name = "aoede"
version = "0.10.0"
authors = ["Max Isom <hi@maxisom.me>"]
edition = "2021"

[dependencies]
songbird = "0.6.1"
# songbird disables all symphonia decoders by default; we feed it raw f32 PCM.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "cache", "model", "rustls_backend", "voice"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
flume = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
figment = { version = "0.10", features = ["toml", "env"] }

[profile.dev]
split-debuginfo = "unpacked"
