# Paste this into Portainer: Stacks > Add stack > Web editor.
# Fill in the values below, then deploy.
# First start: open Spotify on a phone or computer on the same network as this
# server and pick the "Aoede" device once to pair it (see the README).
services:
  aoede:
    image: ghcr.io/landonhalley/aoede:latest
    container_name: aoede
    restart: unless-stopped
    # Host networking lets the Spotify app discover the device on your network for pairing
    network_mode: host
    volumes:
      # Soloist pairing, cache and the downloaded Soloist build
      - aoede-data:/data
    environment:
      - DISCORD_TOKEN=your-discord-bot-token
      # Discord user ID of the user you want Aoede to follow
      - DISCORD_USER_ID=your-discord-user-id
      # Spotify Soloist API key from https://developer.spotify.com/dashboard/soloist
      - SOLOIST_API_KEY=your-soloist-api-key
      # Optional: name shown in Spotify Connect
      - SPOTIFY_DEVICE_NAME=Aoede
      # Optional: initial Spotify volume (0-100)
      - SOLOIST_INITIAL_VOLUME=

volumes:
  aoede-data:
