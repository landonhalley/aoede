services:
  aoede:
    build: .
    image: aoede
    restart: unless-stopped
    # Host networking lets the Spotify app discover the device on your network for pairing
    network_mode: host
    volumes:
      # Soloist pairing, cache and the downloaded Soloist build
      - ./aoede:/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Discord user ID of the user you want Aoede to follow
      - DISCORD_USER_ID=${DISCORD_USER_ID}
      # Spotify Soloist API key from https://developer.spotify.com/dashboard/soloist
      - SOLOIST_API_KEY=${SOLOIST_API_KEY}
      # Optional: name shown in Spotify Connect. Defaults to "Aoede"
      - SPOTIFY_DEVICE_NAME=${SPOTIFY_DEVICE_NAME:-}
      # Optional: initial Spotify volume (0-100)
      - SOLOIST_INITIAL_VOLUME=${SOLOIST_INITIAL_VOLUME:-}
